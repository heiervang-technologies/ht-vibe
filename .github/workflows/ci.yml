name: CI

permissions:
  contents: write

# Use our Nix Flake Environment for steps
defaults:
  run:
    shell: nix develop --command bash {0}

on:
  pull_request:
    branches: [ "main", "ht" ]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

jobs:
  shader-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Check shader cycle syntax
        run: bash -n utils/cycle-shader.sh
      - name: Test shader discovery and cycling
        run: python3 -m unittest discover -s utils/tests -v

  formatting:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: TornaxO7/rust-template@v3-ci-actions
      # Format the contributor's actual head, not GitHub's synthetic merge ref.
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check formatting
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: cargo fmt --check --verbose
      - name: Format code
        id: format_code
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cargo fmt --verbose
          echo "modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)" >> $GITHUB_OUTPUT

      - name: Committing reformatted code
        if: |
          steps.format_code.outputs.modified == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --global user.name 'Github Actions'
          git config --global user.email '<>'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git commit -am "Automated formatting"
          git push origin "HEAD:$PR_HEAD_REF"

  clippy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: TornaxO7/rust-template@v3-ci-actions
      - name: Check best practices (Clippy)
        run: cargo clippy --verbose -- -Dwarnings

  tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci --command bash {0}
    steps:
      - uses: TornaxO7/rust-template@v3-ci-actions
      - name: Running tests
        run: cargo test -j 2 --verbose -- --test-threads=2
