name: CI

permissions:
  contents: write

# Use our Nix Flake Environment for steps
defaults:
  run:
    shell: nix develop --command bash {0}

on:
  pull_request:
    branches: [ "main", "ht" ]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: TornaxO7/rust-template@v3-ci-actions
      - name: Check formatting
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: cargo fmt --check --verbose
      - name: Format code
        id: format_code
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cargo fmt --verbose
          echo "modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)" >> $GITHUB_OUTPUT

      - name: Committing reformatted code
        if: |
          steps.format_code.outputs.modified == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global user.name 'Github Actions'
          git config --global user.email '<>'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git commit -am "Automated formatting"
          git push

  clippy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: TornaxO7/rust-template@v3-ci-actions
      - name: Check best practices (Clippy)
        run: cargo clippy --verbose -- -Dwarnings

  tests:
    if: github.event.pull_request.draft == false
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Running tests
        run: cargo test -j 2 --verbose

  web:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Check shader catalog
        run: python3 utils/sync-web-shaders.py --check
      - name: Test shader synchronization
        run: python3 -m unittest discover -s utils/tests
      - name: Check browser JavaScript
        run: |
          node --input-type=module --check < vibe-web/www/main.js
          node --input-type=module --check < vibe-web/www/shader-catalog.js
      - name: Build web crate
        run: cargo build --locked -p vibe-web --target wasm32-unknown-unknown
