name: CI

# Nothing here writes to the repository: formatting is checked, not committed.
permissions:
  contents: read

# Use our Nix Flake Environment for steps
defaults:
  run:
    shell: nix develop --command bash {0}

on:
  # The merged state of the default branch is tested too, not only PR heads.
  push:
    branches: [ "ht" ]
  pull_request:
    branches: [ "main", "ht" ]
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  shader-cycle:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Check shader cycle syntax
        run: bash -n utils/cycle-shader.sh
      - name: Test shader discovery and cycling
        run: python3 -m unittest discover -s utils/tests -v

  formatting:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: TornaxO7/rust-template@v3-ci-actions
      - name: Check formatting
        run: cargo fmt --check --verbose

  clippy:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: TornaxO7/rust-template@v3-ci-actions
      - name: Check best practices (Clippy)
        run: cargo clippy --verbose -- -Dwarnings
      - name: Check audio test targets (Clippy)
        run: cargo clippy -p vibe-audio --all-targets --verbose -- -Dwarnings

  tests:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: nix develop .#ci --command bash {0}
    steps:
      - uses: TornaxO7/rust-template@v3-ci-actions
      - name: Running tests
        run: cargo test -j 2 --verbose -- --test-threads=2

  web:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Generate browser shader copies and catalog
        run: |
          python3 utils/sync-web-shaders.py
          python3 utils/sync-web-shaders.py --check
      - name: Check browser JavaScript
        run: |
          node --input-type=module --check < vibe-web/www/main.js
          node --input-type=module --check < vibe-web/www/shader-catalog.js
      - name: Build web crate
        run: cargo build --locked -p vibe-web --target wasm32-unknown-unknown
